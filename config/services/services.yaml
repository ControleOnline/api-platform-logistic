services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true 
    ControleOnline\:
        resource: '../../src/*'
        exclude: '../../src/{DependencyInjection,Entity,Resource,Migrations,Library,Message,Tests,Kernel.php}'
    ControleOnline\Repository\:
        resource: '../../src/Repository'
        tags: ['doctrine.repository_service']
    ControleOnline\Controller\:
        resource: '../../src/Controller'
        tags: ['controller.service_arguments']
    ControleOnline\Command\:
        resource: '../../src/Command'
        tags: ['console.command']
    ControleOnline\Filter\:
        resource: '../../src/Filter'
    ControleOnline\Service\QuoteLogisticsService:
        factory: ['@ControleOnline\Service\QuoteLogisticsServiceFactory', 'create']
    ControleOnline\Doctrine\Extension\DeliveryTaxGroupSecurityExtension:
        tags:
            - { name: 'api_platform.doctrine.orm.query_extension.collection' }
            - { name: 'api_platform.doctrine.orm.query_extension.item' }
    ControleOnline\Doctrine\Extension\DeliveryCourierPresenceSecurityExtension:
        tags:
            - { name: 'api_platform.doctrine.orm.query_extension.collection' }
            - { name: 'api_platform.doctrine.orm.query_extension.item' }
